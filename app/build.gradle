plugins { id 'com.android.application' }

android {
    namespace 'com.ahzcpp.rrlock'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ahzcpp.rrlock'
        minSdk 30          // Android 11 起才有 DisplayModeDirector
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
